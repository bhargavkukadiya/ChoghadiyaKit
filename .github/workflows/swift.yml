name: Swift CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-14
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.x'

    - name: Verify Environment
      run: |
        xcodebuild -version
        swift --version

    - name: Swift Build (Strict Concurrency)
      run: swift build -Xswiftc -strict-concurrency=complete

    - name: Swift Test
      run: swift test -Xswiftc -strict-concurrency=complete
