name: Swift CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-15
    steps:
    - name: Checkout Code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Select Xcode 16
      run: |
        XCODE_APP=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
        if [ -z "$XCODE_APP" ]; then
          XCODE_APP="/Applications/Xcode.app"
        fi
        echo "Selected Xcode: $XCODE_APP"
        sudo xcode-select -s "$XCODE_APP/Contents/Developer"
        echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> $GITHUB_ENV
        xcodebuild -version
        swift --version

    - name: Swift Build (Strict Concurrency)
      run: swift build -Xswiftc -strict-concurrency=complete

    - name: Swift Test
      run: swift test -Xswiftc -strict-concurrency=complete
